<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>潛藏在你內心的性格花精靈 · 試玩版</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;1,400&display=swap');
:root{
  --bg:#fdf2f4; --paper:#fffafb; --ink:#4a3338; --ink-soft:#8a6f76;
  --lav:#e89aa8; --lav-deep:#c2566e; --lav-soft:#fed8dd; --gold:#c2a878;
  --line:#f6dde2; --accent:#fde9ec;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:
    radial-gradient(1200px 600px at 80% -10%, #fde4e8 0%, transparent 55%),
    radial-gradient(900px 500px at 0% 110%, #fde7eb 0%, transparent 50%),
    var(--bg);
  color:var(--ink); font-family:'Noto Serif TC',serif; min-height:100vh;
  display:flex; justify-content:center; padding:40px 18px;
}
.wrap{width:100%;max-width:540px}
.card{
  background:var(--paper); border:1px solid var(--line); border-radius:8px;
  box-shadow:0 30px 70px -30px rgba(90,70,120,.35); overflow:hidden; position:relative;
}
.hide{display:none!important}
.brand-logo{width:180px;height:auto;margin:0 auto 22px;display:block;opacity:.9}
.quiz-logo{width:120px;height:auto;display:block;margin:0 auto 18px;opacity:.85}
.r-brand{text-align:center;padding:8px 0 0}
.r-brand img{width:140px;height:auto;opacity:.85}
.r-flower-ph{font-size:14px;color:var(--lav-deep);letter-spacing:.1em;border:1px dashed var(--lav-soft);border-radius:10px;padding:30px 40px;background:rgba(255,255,255,.5)}
.q-nav{display:flex;align-items:center;gap:14px}
.q-prev{font-size:12px;color:var(--ink-soft);cursor:pointer;letter-spacing:.05em;background:none;border:none;font-family:inherit;padding:0}
.q-prev:hover{color:var(--lav-deep)}
.q-prev:disabled{opacity:.3;cursor:not-allowed}
.desc-real{font-size:14.5px;line-height:2;text-align:justify;color:var(--ink);letter-spacing:.02em}
.desc-note{margin-top:10px;font-size:11.5px;color:var(--gold);font-style:italic;text-align:center}

/* ===== 首頁 ===== */
.home{padding:54px 40px 46px;text-align:center}
.home .sub{font-family:'Cormorant Garamond';letter-spacing:.34em;text-transform:uppercase;font-size:12px;color:var(--gold);margin-bottom:18px}
.home h1{font-size:30px;font-weight:600;letter-spacing:.08em;line-height:1.5;margin-bottom:14px}
.home .lead{font-size:15px;color:var(--ink-soft);line-height:1.9;margin-bottom:14px}
.home .flower-emoji{font-size:46px;margin:8px 0 22px}
.ver-btns{display:flex;flex-direction:column;gap:14px;margin-top:30px}
.ver-btn{
  border:1px solid var(--lav-soft);background:#fff;border-radius:8px;padding:20px 22px;cursor:pointer;
  text-align:left;transition:.2s;display:flex;align-items:center;gap:16px;
}
.ver-btn:hover{border-color:var(--lav-deep);background:var(--accent);transform:translateY(-2px)}
.ver-btn .vno{flex:none;width:46px;height:46px;border-radius:50%;background:linear-gradient(150deg,#fcc9d3,#ef9aaa);
  display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond';font-size:22px;color:#fff;font-weight:600}
.ver-btn .vtxt .vt{font-size:17px;font-weight:600;letter-spacing:.04em}
.ver-btn .vtxt .vd{font-size:12.5px;color:var(--ink-soft);margin-top:4px;line-height:1.6}
.home .note{margin-top:26px;font-size:12px;color:var(--ink-soft);line-height:1.7}

/* ===== 測驗頁 ===== */
.quiz{padding:34px 36px 40px}
.q-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.q-back{font-size:12px;color:var(--lav-deep);cursor:pointer;letter-spacing:.05em;background:none;border:none;font-family:inherit}
.q-tag{font-size:10px;letter-spacing:.18em;color:var(--ink-soft);background:var(--accent);border:1px solid var(--line);padding:4px 10px;border-radius:20px;text-transform:uppercase;font-family:'Cormorant Garamond'}
.bar{height:5px;background:var(--accent);border-radius:3px;overflow:hidden;margin:14px 0 26px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ef9aaa,#e89aa8);width:0;transition:width .4s ease}
.q-num{font-family:'Cormorant Garamond';font-size:13px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin-bottom:8px}
.q-text{font-size:19px;font-weight:600;line-height:1.6;letter-spacing:.02em;margin-bottom:8px}
.q-hint{font-size:12.5px;color:var(--lav-deep);margin-bottom:20px}
.opts{display:flex;flex-direction:column;gap:11px}
.opt{
  border:1px solid var(--line);background:#fff;border-radius:7px;padding:15px 17px;cursor:pointer;
  font-size:14.5px;line-height:1.55;transition:.15s;display:flex;align-items:center;gap:12px;
}
.opt:hover{border-color:var(--lav)}
.opt.sel{border-color:var(--lav-deep);background:var(--accent)}
.opt .tick{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--lav-soft);display:flex;align-items:center;justify-content:center;transition:.15s}
.opt.sel .tick{background:var(--lav-deep);border-color:var(--lav-deep)}
.opt.sel .tick::after{content:"✓";color:#fff;font-size:12px}
.opt.multi .tick{border-radius:5px}
.q-actions{margin-top:24px;display:flex;justify-content:flex-end}
.btn{background:var(--lav-deep);color:#fff;border:none;border-radius:24px;padding:12px 34px;font-size:14.5px;font-family:inherit;cursor:pointer;letter-spacing:.08em;transition:.2s}
.btn:hover{background:#a8435a}
.btn:disabled{background:#f3cdd4;cursor:not-allowed}

/* ===== 結果頁 ===== */
.result{position:relative}
.r-stage{height:240px;display:flex;align-items:center;justify-content:center;position:relative;
  background:radial-gradient(360px 160px at 50% 120%,#fcdfe4,transparent 70%),linear-gradient(180deg,#fde6ea,#fef3f5)}
.r-flower{font-size:72px;animation:pop .8s cubic-bezier(.3,1.3,.5,1)}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.r-stage .placeholder{position:absolute;bottom:12px;font-size:10px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;font-family:'Cormorant Garamond'}
.block{padding:26px 38px;border-top:1px solid var(--line)}
.block:first-of-type{border-top:none}
.b-lab{font-size:10.5px;letter-spacing:.26em;color:var(--gold);text-transform:uppercase;font-family:'Cormorant Garamond';margin-bottom:12px;text-align:center}
.r-name{text-align:center}
.r-name .io{font-family:'Cormorant Garamond';letter-spacing:.26em;text-transform:uppercase;font-size:12px;color:var(--lav-deep);margin-bottom:4px}
.r-name .nm{font-size:30px;font-weight:600;letter-spacing:.1em;margin-bottom:12px}
.r-name .quote{font-size:16px;color:var(--lav-deep);font-weight:500;letter-spacing:.04em}
.tbd{color:var(--ink-soft);font-size:14px;line-height:1.9;text-align:center;font-style:italic}
.pairs{display:flex;gap:14px;justify-content:center}
.pair{flex:1;background:var(--accent);border:1px solid var(--line);border-radius:7px;padding:16px 12px;text-align:center}
.pair .role{font-size:10.5px;letter-spacing:.14em;color:var(--lav-deep);font-family:'Cormorant Garamond';text-transform:uppercase;margin-bottom:8px}
.pair .pf{font-size:30px;margin-bottom:6px}
.pair .pf-ph{font-size:11px;color:var(--lav-deep);line-height:1.4;border:1px dashed var(--lav-soft);border-radius:8px;padding:10px 4px;margin-bottom:8px;background:rgba(255,255,255,.6)}
.cf-ph{flex:none;width:44px;height:44px;border-radius:50%;border:1px dashed var(--lav-soft);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--lav-deep);text-align:center;line-height:1.2;background:rgba(255,255,255,.6)}
.pair .who{font-size:14.5px;font-weight:600}
.care{display:flex;align-items:center;gap:14px;background:#fef4f6;border:1px solid var(--line);border-radius:7px;padding:15px 17px}
.care .cf{flex:none;width:44px;height:44px;border-radius:50%;background:linear-gradient(150deg,#fcc9d3,#ef9aaa);display:flex;align-items:center;justify-content:center;font-size:22px}
.care .ct .t{font-size:14.5px;font-weight:600;color:var(--lav-deep)}
.care .ct .d{font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin-top:3px}
.r-foot{padding:24px 38px 34px;display:flex;gap:12px;justify-content:center;border-top:1px solid var(--line)}
.r-foot .btn.ghost{background:#fff;color:var(--lav-deep);border:1px solid var(--lav-soft)}
.r-foot .btn.ghost:hover{background:var(--accent)}
</style>
</head>

const SPIRITS = {
  自然系_外:{name:"活潑自然系",quote:"真話也許不中聽，但那是我的誠意",io:"UNFILTERED · 外向",
    desc:"你是那種喜怒都寫在臉上、藏不住真心的人。想到什麼就說什麼，開心會大笑、不滿也擺在臉上，跟你相處的人永遠不必猜你在想什麼，因為你從不偽裝。你討厭虛假與場面話，寧可直話直說也不願違心迎合——這份率真有時不中聽，卻是你最大的溫柔，因為你把最真實的自己毫無保留地交給了身邊的人。你的能量是外放的、熱鬧的，走到哪裡都帶著一股鮮活的生命力，讓人感到輕鬆自在、沒有距離。對你來說，活得真實比活得完美更重要，你也用這份坦率，提醒身邊的人可以更勇敢地做自己。"},
  自然系_內:{name:"真誠自然系",quote:"我不演，因為真實才走得久",io:"UNFILTERED · 內向",
    desc:"你的真誠是有重量的。不是熱熱鬧鬧的那種直白，而是「我說的每一句都是真心話」的那種安靜的誠懇。你不擅長、也不屑於場面話、客套與迎合，比起經營人脈，你更在乎關係裡的真實。跟你相處久了，人們會發現你從裡到外一致——你不會在背後說一套、當面做另一套，這份表裡如一讓人特別放心。你不需要成為焦點，也不急著證明什麼，只是安靜地守著自己的步調與原則。正因為你的真心從不打折，你給出的信任與陪伴也格外珍貴。對你而言，真實才走得長久，而你願意用一輩子去實踐這件事。"},
  質感系_外:{name:"大方質感系",quote:"我的選擇，向來有我的道理",io:"NOBLE · 外向",
    desc:"你有想法，而且樂於分享。你會大方告訴別人你相信什麼、為什麼這樣選，你的品味是「說得出來、帶得走」的那一種。在朋友圈裡，你常常是那個被詢問意見的人——大家信任你的眼光，因為你的每個選擇背後都有清楚的理由，不是隨波逐流，而是經過思考的堅持。你對生活有自己的標準，懂得分辨什麼值得、什麼不值得，並且願意為真正好的事物付出。你的自信與審美讓你很容易成為意見領袖，但你的影響力來自真誠的分享，而非炫耀。你相信，懂得選擇的人生，才會活得精緻而篤定。"},
  質感系_內:{name:"內斂質感系",quote:"講究不必說出口，懂的人就懂",io:"NOBLE · 內向",
    desc:"你有自己的原則和品味，但你不爭辯、也不急著說服別人，只是安靜地照著自己的那把尺過生活。你的講究藏在細節裡——一個杯子的觸感、一段獨處的儀式、一件耐用的好物，這些不必說出口，懂的人自然看得出來。你不追逐流行，也不在意別人是否認同，因為你的標準是給自己的，不是給別人看的。你享受獨處時那份有質感的寧靜，也在反覆斟酌中確認什麼最適合自己。這份低調的講究，讓你的生活始終維持著一種優雅的秩序感。對你來說，真正的品味從不喧嘩，它只是靜靜地、長久地陪著你。"},
  溫暖系_外:{name:"可靠溫暖系",quote:"你的事就是我的事",io:"FORTIFY · 外向",
    desc:"你是標準的「罩全場大姐頭」。熱情、有肩膀，朋友有難你第一個衝去張羅，嘴上可能唸幾句，但事情早就替對方扛下了。你的暖是高調而強壯的——不只是嘴上關心，而是真的會行動、會解決問題、會把人照顧得妥妥當當。有你在的場合，大家就有種莫名的安心感，因為知道無論發生什麼，你都會挺身而出。你重情重義，把在乎的人的事當成自己的事，這份義氣讓你身邊總是聚著一群信任你的人。你或許不擅長示弱，總是當那個給予的人，但別忘了，這麼努力照顧大家的你，也值得被好好照顧。"},
  溫暖系_內:{name:"守護溫暖系",quote:"無論你做什麼決定，我都會陪著你",io:"FORTIFY · 內向",
    desc:"你靠得住，而且總是默默地罩著別人。你不會大張旗鼓地宣告自己做了什麼，卻總在對方最需要的時候，悄悄把事情處理好。你的情義藏在行動裡——話不多，但你的陪伴從不缺席。你習慣觀察身邊人的需要，在他們開口之前就先準備好，這份細膩而低調的溫柔，往往要相處久了才會被發現，卻也因此格外動人。你不求回報、不愛邀功，只是單純地希望在乎的人能過得好。對你來說，愛不是說出來的承諾，而是「無論你做什麼決定，我都會在」的那份安靜守候。你是很多人心裡最有安全感的存在。"},
  神秘系_外:{name:"朦朧神秘系",quote:"再熟我都需要自己的小世界",io:"UNIQUE · 外向",
    desc:"你活躍、好相處，表面上跟誰都聊得來，但身邊的人總覺得你還有一層看不透。你樂於與人互動，卻把最真實、最深處的自己留給自己——熱鬧是你的保護色，獨特才是你的底色。你享受社交，也享受抽身後一個人的小世界，那是你充電、也是你最自在的地方。你不輕易讓人完全靠近，不是冷漠，而是你深知有些部分只屬於自己。這份「再熟我都需要保留一點空間」的特質，讓你始終帶著一種猜不透的魅力，越認識你，越覺得你有意思。你在親近與距離之間拿捏得恰到好處，既給得出溫度，也守得住自我。"},
  神秘系_內:{name:"高冷神秘系",quote:"距離造就美麗",io:"UNIQUE · 內向",
    desc:"你有距離、有自己的小宇宙，不輕易讓人靠近。你不從眾、不解釋，安靜地活在自己的節奏裡，對於不理解你的人，你也不費力去爭取認同。這份疏離不是高傲，而是一種清醒——你很清楚自己要什麼、不要什麼，也享受獨處帶來的自由與餘裕。你相信距離能造就美麗，適當的留白讓關係與自我都更有質感。你或許不是人群中最熱絡的那個，卻常常是最讓人好奇、最有辨識度的存在。真正走進你世界的人不多，但能進來的，都會發現你獨特而豐富的內在。你活得像一株稀有的花，不為誰盛開，只為忠於自己。"},
  療癒系_外:{name:"熱情療癒系",quote:"照亮別人是我存在的意義",io:"RITUAL · 外向",
    desc:"你主動把溫柔送出去，擅長察覺氣氛、暖場、讓每個人都感到自在。你像朋友圈裡的小太陽，總能在不知不覺間把溫暖傳遞給身邊的人。你不一定急著幫對方解決問題，但你會陪著他、懂他的情緒，讓他覺得被接住、被理解。你對他人的感受特別敏銳，常常是第一個發現別人不對勁的人，也願意主動伸出手。照亮別人，對你來說不是負擔，而是一種存在的意義與快樂。不過，總是散發光與熱的你，也需要記得替自己留一點餘溫——當你願意先善待自己，你的溫柔才能走得更長更遠。你的存在，本身就是一種療癒。"},
  療癒系_內:{name:"傾聽療癒系",quote:"你說，我聽",io:"RITUAL · 內向",
    desc:"你的溫柔是安靜的。你不多話，但很會傾聽，總能在別人低落時輕輕接住他的情緒。比起給建議，你更擅長陪伴——一個專注的眼神、一句「我懂」，就能讓對方覺得安心。待在你身邊沒有壓力，像是被一種柔軟的平靜包圍著。你天生敏感，能讀懂別人沒說出口的心情，這讓你成為許多人傾訴的對象。但也因為總是把別人放在前面，你偶爾會忘了自己也需要被傾聽、被照顧。對你來說，最好的休息，是留一段不被打擾的時光給自己，讓那些替別人承接的情緒，也有機會輕輕放下。你的存在，讓世界多了一個可以安心軟弱的角落。"},
  探索系_外:{name:"熱血探索系",quote:"好不好，做了就知道！",io:"LONGEVITY · 外向",
    desc:"你衝勁十足又有想法，看到新事物會主動研究、拉著大家一起嘗試。你的冒險不是莽撞亂衝，而是相信「用更聰明的方法，可以讓自己和生活變得更好」。你把這份好奇大聲地活出來，是團體裡那個推動大家往前的行動引擎。你不害怕改變，反而把改變當成機會——與其在原地猶豫，你更相信「做了就知道」。你的熱情有感染力，常常能點燃身邊人嘗試新事物的勇氣。你樂於走在前面、率先體驗，再把心得分享給大家。對你來說，人生就是一場不斷探索的旅程，停下來太可惜，往前走才精彩。你的勇敢，讓平凡的日子也充滿新鮮感。"},
  探索系_內:{name:"理性探索系",quote:"有邏輯和依據才能說服我",io:"LONGEVITY · 內向",
    desc:"你是安靜的理性派。你喜歡一個人鑽研、分析，認定有道理的事就默默去做、去優化。你相信邏輯與科技的力量，做決定前習慣先把資料查清楚，不輕易被情緒或潮流帶著走，但一旦想通了，你會比誰都堅定地執行。你不張揚，也不愛搶風頭，卻總是悄悄地走在別人前面，把自己一點一點升級得更好。你對新知有源源不絕的好奇，享受獨自深掘一個領域的過程，那是你最專注、最有成就感的時刻。你或許話不多，但你的每個觀點都經過思考、有憑有據。對你來說，改變不是衝動，而是建立在理性之上的選擇——這讓你既前衛，又可靠。"},
};
// 保養主張（趨勢對應）
const CARE = {
  自然系:{f:"🌱",t:"健康保養 Unfiltered",d:"由內而外養好底子，讓素顏也有光。"},
  質感系:{f:"🪷",t:"永續信念 Noble",d:"選擇真正值得的，讓保養也能長久而講究。"},
  溫暖系:{f:"🛡️",t:"防禦修護 Fortify",d:"先把自己的屏障顧好，才有餘力照顧別人。"},
  神秘系:{f:"💎",t:"頂級珍稀 Unique",d:"用獨一無二的珍稀保養，呼應你的與眾不同。"},
  療癒系:{f:"🌿",t:"療癒儀式 Ritual",d:"用香氛與夜間修護，為自己留一段安靜的放鬆。"},
  探索系:{f:"🧪",t:"醫美共生 Longevity",d:"擁抱科技與新方法，超前部署你的美。"},
};
// 最合拍花精靈（草稿配對）：對應到 12 種具名花精靈(系_io)
// like=最懂你(氣質相近)，comp=最互補(性格互補)
const MATCH = {
  自然系_外:{like:"療癒系_外",comp:"質感系_內"},
  自然系_內:{like:"療癒系_內",comp:"質感系_外"},
  質感系_外:{like:"神秘系_外",comp:"自然系_內"},
  質感系_內:{like:"神秘系_內",comp:"自然系_外"},
  溫暖系_外:{like:"療癒系_外",comp:"探索系_內"},
  溫暖系_內:{like:"療癒系_內",comp:"探索系_外"},
  神秘系_外:{like:"質感系_外",comp:"溫暖系_內"},
  神秘系_內:{like:"質感系_內",comp:"溫暖系_外"},
  療癒系_外:{like:"溫暖系_外",comp:"探索系_內"},
  療癒系_內:{like:"溫暖系_內",comp:"探索系_外"},
  探索系_外:{like:"自然系_外",comp:"療癒系_內"},
  探索系_內:{like:"自然系_內",comp:"療癒系_外"},
};

// 天花板
const CEIL = {自然系:6,質感系:4,溫暖系:4,神秘系:5,療癒系:6,探索系:5};
// fallback 優先序（數字小優先）
const PRIORITY = {神秘系:1,探索系:2,質感系:3,療癒系:4,自然系:5,溫暖系:6};

/* ---- 第一版題目 ---- */
const QUIZ_A = [
 {q:"週末午後你漫步進一間神祕花園，你會先看到什麼？",opts:[
   ["微風徐徐，一片五顏六色盛放的花海","溫暖系","外"],
   ["一條蜿蜒小路，兩側花叢都是你最喜歡的花","質感系","內"],
   ["在花園一角，獨自綻放的珍稀花朵","神秘系","內"],
   ["一張木椅、一個盪鞦韆，被一株株植物圍繞","療癒系","內"],
   ["從未見過的奇特花種盛開","探索系","外"],
 ]},
 {q:"最近壓力大、心靈有點枯萎時，哪種活動最能治癒你？",opts:[
   ["找朋友傾訴小聚，講完就好多了","溫暖系","外"],
   ["一個人獨處，安靜地沉澱思緒","神秘系","內"],
   ["逛街購物就能排解負面情緒","質感系","外"],
   ["去運動流汗，把情緒甩掉","探索系","外"],
   ["用一頓美食美酒，為心靈補一劑營養針","自然系","外"],
   ["回家追劇、做家務、烹飪，只要能放空就行","療癒系","內"],
 ]},
 {q:"如果要挑一盆花放在你的桌前，你通常怎麼決定？",opts:[
   ["覺得每種都好美、各有特色，難以抉擇","療癒系","內"],
   ["謹慎評估花期、照顧難易度，一定要選到CP值最高的","質感系","內"],
   ["先拍照問閨蜜或家人意見，才做決定","溫暖系","外"],
   ["憑直覺，看到哪盆順眼就選它","自然系","外"],
 ]},
 {q:"朋友開店生意不好、心情低落，你會怎麼陪伴他？",opts:[
   ["立刻幫他出謀劃策，想各種建議幫花店起死回生","溫暖系","外"],
   ["默默到花店陪著他，聽他訴苦，當他最溫柔的垃圾桶","療癒系","內"],
   ["拉著他離開花店，轉換環境、轉換心情","探索系","外"],
   ["陪他一起哭、一起罵景氣，感同身受他的委屈","自然系","外"],
 ]},
 {q:"如果要買一件花的時尚單品，你最在意什麼？",opts:[
   ["喜歡就好，不想太多","自然系","中"],
   ["品質和質感要夠好","質感系","中"],
   ["要珍貴獨特、最好別人沒有","神秘系","中"],
   ["是否為新上市商品、有獨家設計","探索系","中"],
   ["身邊多數人都有的我不能不買，喜歡跟朋友一樣的感覺","溫暖系","中"],
 ]},
 {q:"你最希望自己在別人眼中的形象是？",opts:[
   ["優雅綻放，懂得生活、懂得精緻地善待自己","質感系","內"],
   ["溫暖和煦，是身邊人的小太陽與正能量來源","溫暖系","外"],
   ["聰明果敢、無畏環境改變都能生存","探索系","內"],
   ["有個性、散發獨特風格魅力","神秘系","外"],
 ]},
];

/* ===================== 流程控制 ===================== */
let ver='A', quiz=[], qi=0, answers=[];

function start(v){
  ver=v; quiz = QUIZ_A; qi=0;
  answers=quiz.map(item=> item.multi ? [] : null);
  document.getElementById('qtag').textContent = '花精靈測驗';
  show('quiz'); renderQ();
}
function goHome(){show('home');}
function show(id){['home','quiz','result'].forEach(x=>document.getElementById(x).classList.add('hide'));document.getElementById(id).classList.remove('hide');window.scrollTo(0,0);}

function renderQ(){
  const item=quiz[qi];
  const multi=!!item.multi;
  document.getElementById('qnum').textContent='Question '+(qi+1)+' / '+quiz.length;
  document.getElementById('qtext').textContent=item.q;
  document.getElementById('bar').style.width=((qi)/quiz.length*100)+'%';
  const hint=document.getElementById('qhint');
  if(multi){hint.classList.remove('hide');hint.textContent='可複選（選好後按下一題）';}else{hint.classList.add('hide');}
  const box=document.getElementById('opts'); box.innerHTML='';
  item.opts.forEach((o,idx)=>{
    const div=document.createElement('div');
    div.className='opt'+(multi?' multi':'');
    const sel = multi ? answers[qi].includes(idx) : answers[qi]===idx;
    if(sel) div.classList.add('sel');
    div.innerHTML='<div class="tick"></div><div>'+o[0]+'</div>';
    div.onclick=()=>{
      if(multi){
        const arr=answers[qi]; const p=arr.indexOf(idx);
        if(p>=0) arr.splice(p,1); else arr.push(idx);
        renderQ();
      }else{
        answers[qi]=idx;
        renderQ();
        setTimeout(advance,180);
      }
    };
    box.appendChild(div);
  });
  const nextBtn=document.getElementById('next');
  nextBtn.textContent = (qi===quiz.length-1)?'看結果':'下一題';
  // 單選題隱藏按鈕(點選即跳)，多選題顯示按鈕
  nextBtn.style.display = multi ? 'block' : 'none';
  nextBtn.disabled = multi ? (answers[qi].length===0) : (answers[qi]===null);
  // 上一題按鈕：第一題時禁用
  document.getElementById('prev').disabled = (qi===0);
}

function advance(){
  // 單選自動前進專用，含防呆
  const item=quiz[qi];
  if(!item) return;
  if(!item.multi && answers[qi]===null) return;
  if(qi<quiz.length-1){ qi++; renderQ(); }
  else{ computeResult(); }
}

function nextQ(){
  const item=quiz[qi];
  if(!item) return;
  if(item.multi && answers[qi].length===0) return;
  if(!item.multi && answers[qi]===null) return;
  if(qi<quiz.length-1){ qi++; renderQ(); }
  else{ computeResult(); }
}

function prevQ(){
  if(qi>0){ qi--; renderQ(); }
}

function computeResult(){
  // 計分
  const score={自然系:0,質感系:0,溫暖系:0,神秘系:0,療癒系:0,探索系:0};
  const io={外:0,內:0};
  quiz.forEach((item,i)=>{
    const ans=answers[i];
    const picks = item.multi ? (ans||[]) : (ans===null||ans===undefined?[]:[ans]);
    picks.forEach(idx=>{
      const o=item.opts[idx];
      if(!o) return;                    // 防呆：索引無效就跳過
      if(o[1]) score[o[1]]++;           // 第一維度
      if(!item.multi && (o[2]==='外'||o[2]==='內')) io[o[2]]++;  // 第二維度(多選不計)
    });
  });
  // 第一維度：百分比三層
  const systems=Object.keys(score);
  systems.sort((a,b)=>{
    const pa=score[a]/CEIL[a], pb=score[b]/CEIL[b];
    if(pb!==pa) return pb-pa;
    if(score[b]!==score[a]) return score[b]-score[a];
    return PRIORITY[a]-PRIORITY[b];
  });
  const mainSys=systems[0];
  // 第二維度：外向/內向（平手預設內向）
  const dir = io.外>io.內 ? '外' : '內';
  renderResult(mainSys,dir);
}

function renderResult(sys,dir){
  const key=sys+'_'+dir;
  const sp=SPIRITS[key];
  document.getElementById('rio').textContent=sp.io;
  document.getElementById('rname').textContent=sp.name;
  document.getElementById('rquote').textContent=sp.quote;
  document.getElementById('rdesc').textContent=sp.desc;
  // 合拍（顯示12種具名花精靈）
  const m=MATCH[key];
  document.getElementById('m1').textContent=SPIRITS[m.like].name;
  document.getElementById('m2').textContent=SPIRITS[m.comp].name;
  // 保養
  const ca=CARE[sys];
  document.getElementById('caret').textContent=ca.t;
  document.getElementById('cared').textContent=ca.d;
  document.getElementById('bar').style.width='100%';
  show('result');
}

document.getElementById('replay').onclick=()=>start(ver);
</script>
